name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Bloquea con 0 errores: `no-unused-vars` y `no-console` ya estan a cero y
      # son `error`, asi que esa deuda no puede volver.
      - name: Run ESLint
        run: npm run lint

      # Techo de warnings. Los 164 que quedan son reglas de la era React Compiler
      # (set-state-in-effect, exhaustive-deps): cada una es un cambio razonado, no
      # una limpieza mecanica. Este paso no exige arreglarlas, solo que el numero
      # no suba. Al bajarlo, baja tambien `lint:ceiling` en package.json.
      - name: Warning ceiling
        run: npm run lint:ceiling

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript check
        run: npx tsc --noEmit

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test]

    env:
      # Sin .env en el runner. Vite inlinea import.meta.env en build, así que
      # basta con placeholders sintácticamente válidos: nada sale a la red.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-build-anon-placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build app
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Lo mismo que construye Coolify. Además de que compile, se comprueba lo que
      # pide el hardening: que no corra como root y que el healthcheck responda.
      - name: Build image
        run: docker build -t godcode-panel:ci .

      - name: Run and check
        run: |
          docker run -d --name panel -e SUPABASE_URL=http://127.0.0.1:54321 -e SUPABASE_ANON_KEY=ci godcode-panel:ci
          user=$(docker exec panel whoami)
          echo "usuario: $user"
          test "$user" = node
          if docker exec panel test -d node_modules/vite; then
            echo "vite (dependencia de desarrollo) quedó en la imagen" >&2
            exit 1
          fi
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' panel)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker logs panel
          exit 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test]

    env:
      # `run-e2e.mjs` levanta Vite en modo e2e sobre 127.0.0.1:5174, así que no
      # se habla con Supabase. Los placeholders solo evitan que el arranque
      # falle por variables ausentes.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Los dos proyectos de playwright.config.ts usan `channel: "chrome"`,
      # no el Chromium empaquetado.
      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  knip:
    name: Dead code (Knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informativo: hoy Knip reporta exports sin usar y duplicados que aún no se
    # han limpiado. No bloquea el merge; sirve para que la deuda sea visible.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Knip
        run: npm run knip
